version: 2

models:
  - name: stg_users
    description: "This model cleans and standardizes the raw user data."
    columns:
      - name: user_id
        description: "The primary key for this model."
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "This model cleans and standardizes the raw sales and orders data."
    columns:
      - name: order_id
        description: "The primary key for this model."
        tests:
          - unique
          - not_null